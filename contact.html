<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
      defer
    ></script>
  </head>
  <body>
    <nav class="nav" aria-label="Main navigation">
      <div class="container nav-inner">
        <a class="brand" href="index.html">MD MONJURUL ALAM</a>
        <button
          id="menu-toggle"
          class="menu-toggle"
          aria-label="Toggle menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="cv.html">CV</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="achievements.html">Achievements</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="entertainment.html">Entertainment</a></li>
        </ul>
        <button
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Toggle dark mode"
        >
          🌙
        </button>
      </div>
    </nav>

    <main>
      <section class="container page">
        <h1>Contact Me</h1>
        <p class="muted">Send a message or connect on social media.</p>

        <form id="contact-form" class="contact-form" aria-label="Contact form">
          <label class="sr-only" for="from_name">Your name</label>
          <input
            id="from_name"
            name="from_name"
            type="text"
            placeholder="Your name"
            required
          />

          <label class="sr-only" for="reply_to">Your email</label>
          <input
            id="reply_to"
            name="reply_to"
            type="email"
            placeholder="Your email"
            required
          />

          <label class="sr-only" for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Your message"
            required
          ></textarea>

          <div class="form-actions">
            <button class="btn primary" type="submit">Send Message</button>
            <p id="form-status" aria-live="polite"></p>
          </div>
        </form>

        <div class="social-links" style="margin-top: 1.5rem">
          <a href="https://github.com/Monju007" target="_blank" rel="noopener"
            >GitHub</a
          >
          <a
            href="https://linkedin.com/in/monju007"
            target="_blank"
            rel="noopener"
            >LinkedIn</a
          >
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container"><p>© 2025 MD MONJURUL ALAM.</p></div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
